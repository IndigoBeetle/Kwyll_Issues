name: Documentation Report
description: Report an issue, or request an addition, to the documentation.
title: "[Doc]: "
labels: ["documentation"]
projects: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: contact
    attributes:
      label: Contact Details
      description: How can we get in touch with you if we need more info?
      placeholder: ex. email@example.com
    validations:
      required: false
  - type: textarea
    attributes:
      label: Description 
      description: Describe the issue or request
      placeholder: |
        Use "/" style naming to identify the section of the docs, i.e. Introduction/Backgrounds/Tiles
    validations:
      required: true  
